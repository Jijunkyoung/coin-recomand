name: Analyze, email and deploy

on:
  push:
    branches: [main]
  schedule:
    # Hourly refresh plus the 07:20 KST primary mail run. Later hourly runs recover a missed schedule.
    - cron: "17 0-21,23 * * *"
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "분석 완료 후 등록 주소로 메일 발송"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check daily email delivery
        if: github.event_name == 'schedule' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[send-daily-email]') || contains(github.event.head_commit.message, '[record-daily-email]')))
        id: delivery
        env:
          GH_API_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          NOT_BEFORE_KST: "07:20"
          FORCE_SEND: ${{ github.event_name == 'push' }}
        run: python scripts/check_daily_email_delivery.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate latest analysis
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINMARKETCAL_API_KEY: ${{ secrets.COINMARKETCAL_API_KEY }}
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          STOCK_HOLDINGS_US: ${{ secrets.STOCK_HOLDINGS_US }}
          STOCK_HOLDINGS_KR: ${{ secrets.STOCK_HOLDINGS_KR }}
          STOCK_SECTORS: ${{ secrets.STOCK_SECTORS }}
          GH_API_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          STOCK_EMAIL_TO: ${{ secrets.STOCK_EMAIL_TO }}
          TEST_EMAIL: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[send-test-email]') }}
          SEND_EMAIL: ${{ (github.event_name == 'schedule' && steps.delivery.outputs.should_send == 'true') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[send-test-email]') || contains(github.event.head_commit.message, '[send-daily-email]'))) || (github.event_name == 'workflow_dispatch' && inputs.send_email) }}
          REQUIRE_EMAIL_DELIVERY: ${{ steps.delivery.outputs.should_send == 'true' && !contains(github.event.head_commit.message, '[record-daily-email]') }}
        run: python -m src.main --output docs/data/latest.json
      - name: Create daily email delivery marker
        if: steps.delivery.outputs.should_send == 'true' && success()
        run: mkdir -p delivery-marker && printf 'sent\n' > delivery-marker/status.txt
      - name: Save daily email delivery marker
        if: steps.delivery.outputs.should_send == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery.outputs.marker_name }}
          path: delivery-marker/status.txt
          retention-days: 3
          if-no-files-found: error
      - name: Configure member authentication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/write_supabase_config.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
