name: Analyze, email and deploy

on:
  push:
    branches: [main]
  schedule:
    # 22:30 UTC = 07:30 KST (next day)
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
