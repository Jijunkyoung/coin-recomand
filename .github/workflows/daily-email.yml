name: Daily email with fallback

on:
  schedule:
    # 07:50 KST fallback. The primary/catch-up path lives in the proven hourly workflow.
    - cron: "50 22 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "오늘 발송 기록이 있어도 강제로 다시 발송"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-email-delivery
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check today's coin delivery marker
        id: coin_delivery
        env:
          GH_API_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send }}
          DELIVERY_MARKER_SCOPE: coin
        run: python scripts/check_daily_email_delivery.py
      - name: Check today's stock delivery marker
        id: stock_delivery
        env:
          GH_API_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send }}
          DELIVERY_MARKER_SCOPE: stock
        run: python scripts/check_daily_email_delivery.py
      - name: Validate mail settings
        if: steps.coin_delivery.outputs.should_send == 'true' || steps.stock_delivery.outputs.should_send == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          STOCK_EMAIL_TO: ${{ secrets.STOCK_EMAIL_TO }}
        run: python scripts/validate_email_config.py
      - name: Load owner's live KIS portfolio for mail
        id: kis_profile
        if: steps.stock_delivery.outputs.should_send == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIS_SCHEDULER_KEY: ${{ secrets.KIS_SCHEDULER_KEY }}
          REQUIRE_MEMBER_STOCK_PROFILE: "true"
        run: python scripts/load_member_stock_profile.py
      - name: Generate and send today's reports
        if: steps.coin_delivery.outputs.should_send == 'true' || (steps.stock_delivery.outputs.should_send == 'true' && steps.kis_profile.outcome == 'success')
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINMARKETCAL_API_KEY: ${{ secrets.COINMARKETCAL_API_KEY }}
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          STOCK_HOLDINGS_US: ${{ secrets.STOCK_HOLDINGS_US }}
          STOCK_HOLDINGS_KR: ${{ secrets.STOCK_HOLDINGS_KR }}
          STOCK_SECTORS: ${{ secrets.STOCK_SECTORS }}
          GH_API_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          STOCK_EMAIL_TO: ${{ secrets.STOCK_EMAIL_TO }}
          EMAIL_REPORT_SCOPE: ${{ (steps.coin_delivery.outputs.should_send == 'true' && steps.kis_profile.outcome == 'success') && 'all' || steps.coin_delivery.outputs.should_send == 'true' && 'coin' || 'stock' }}
          REQUIRE_EMAIL_DELIVERY: "true"
        run: python -m src.main --output docs/data/latest.json --send-email
      - name: Create coin delivery marker
        if: steps.coin_delivery.outputs.should_send == 'true' && success()
        run: mkdir -p coin-delivery-marker && printf 'sent\n' > coin-delivery-marker/status.txt
      - name: Save coin delivery marker
        if: steps.coin_delivery.outputs.should_send == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.coin_delivery.outputs.marker_name }}
          path: coin-delivery-marker/status.txt
          retention-days: 3
          if-no-files-found: error
      - name: Create stock delivery marker
        if: steps.stock_delivery.outputs.should_send == 'true' && steps.kis_profile.outcome == 'success' && success()
        run: mkdir -p stock-delivery-marker && printf 'sent\n' > stock-delivery-marker/status.txt
      - name: Save stock delivery marker
        if: steps.stock_delivery.outputs.should_send == 'true' && steps.kis_profile.outcome == 'success' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stock_delivery.outputs.marker_name }}
          path: stock-delivery-marker/status.txt
          retention-days: 3
          if-no-files-found: error
