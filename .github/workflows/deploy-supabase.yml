name: Deploy Supabase backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/configure_supabase_auth.py"
      - "scripts/resend_owner_confirmation.py"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

concurrency:
  group: supabase-backend-pgtxtnggjqaysjhtdepz
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: pgtxtnggjqaysjhtdepz
      KIS_OWNER_EMAIL_CANDIDATE: ${{ secrets.KIS_OWNER_EMAIL || secrets.STOCK_EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD secret is missing"; exit 1; }
          test -n "$SMTP_HOST" || { echo "SMTP_HOST secret is missing"; exit 1; }
          test -n "$SMTP_USERNAME" || { echo "SMTP_USERNAME secret is missing"; exit 1; }
          test -n "$SMTP_PASSWORD" || { echo "SMTP_PASSWORD secret is missing"; exit 1; }
      - name: Configure Auth confirmation email delivery
        run: python scripts/configure_supabase_auth.py
      - name: Resend owner's pending signup confirmation
        if: contains(github.event.head_commit.message, '[resend-auth-email]')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/resend_owner_confirmation.py
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link target project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        run: supabase db push --linked
      - name: Bind KIS access to the owner's email
        shell: bash
        run: |
          owner_email="$(printf '%s' "$KIS_OWNER_EMAIL_CANDIDATE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$owner_email" ]; then
            echo "KIS_OWNER_EMAIL or STOCK_EMAIL_TO secret is required"
            exit 1
          fi
          if [[ ! "$owner_email" =~ ^[^,@\;]+@[^,@\;]+\.[^,@\;]+$ ]]; then
            echo "KIS owner email must contain exactly one valid address"
            exit 1
          fi
          supabase secrets set KIS_OWNER_EMAIL="$owner_email" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy KIS portfolio function
        run: supabase functions deploy kis-portfolio --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
