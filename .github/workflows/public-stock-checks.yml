name: Public stock source checks

on:
  pull_request:
    paths:
      - "src/stock*.py"
      - "config/sec-identifiers.json"
      - "scripts/check_public_stock_sources.py"
      - ".github/workflows/public-stock-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate stock collectors
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate stock search and charts
        run: npm run test:ui
      - name: Check daily listing refresh without account credentials
        run: python -m src.stock_symbols --output /tmp/public-stock-directory
      - name: Inspect public responses without secrets
        run: python scripts/check_public_stock_sources.py
