name: Public stock source checks

on:
  pull_request:
    paths:
      - "src/stock*.py"
      - "config/sec-identifiers.json"
      - "scripts/check_public_stock_sources.py"
      - ".github/workflows/public-stock-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate stock collectors
        run: python -m unittest discover -s tests
      - name: Inspect public responses without secrets
        run: python scripts/check_public_stock_sources.py
